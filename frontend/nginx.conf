# Configuração do nginx para servir o SPA do frontend.
# Adicionado para o docker-compose; não altera o código da aplicação.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Uploads de planilhas/PDFs podem passar do default de 1MB do nginx.
    client_max_body_size 25m;

    # SPA: qualquer rota desconhecida cai no index.html (roteamento no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para a API do backend (mesma origem -> evita CORS no navegador).
    # O host "backend" é o nome do serviço no docker-compose.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # O envio ao ERP (contrato + AE + pré-nota) faz POSTs ao Protheus com até
        # 120s de timeout CADA. O default do nginx (60s) cortava com 504 enquanto o
        # backend ainda concluía os títulos. Damos folga confortável (5 min).
        proxy_connect_timeout  75s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
    }
}
